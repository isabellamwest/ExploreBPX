name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows is the development baseline: the suite runs clean here, while
    # macOS needs real window activation for a handful of tests.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check app tests scripts
      - name: Format check
        run: uv run ruff format --check app tests scripts
      - name: Tests (headless)
        # On failure, surface the tail of the pytest output as a check-run
        # annotation: annotations are readable through the public API, while
        # the raw job log needs an authenticated session.
        shell: bash
        run: |
          set +e
          uv run pytest -q 2>&1 | tee pytest_out.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$(python -c "import pathlib; s = pathlib.Path('pytest_out.txt').read_text(errors='replace')[-3000:]; print(s.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))")
            echo "::error title=pytest tail (exit $code)::$msg"
          fi
          exit "$code"
        env:
          QT_QPA_PLATFORM: offscreen
